# ansible.cfg
# Configuration Ansible pour ce projet OpenNebula AIO via AWX.

[defaults]
# Inventaire par défaut, relatif à la racine du dépôt.
inventory = ./inventories/opennebula.yml

# On laisse Ansible gérer le gathering des facts (le playbook OneDeploy s'en occupe lui-même).
gathering = explicit

# QoL
host_key_checking = False
retry_files_enabled = False
display_skipped_hosts = True
timeout = 30
stdout_callback = yaml

# IMPORTANT :
# On NE force PAS collections_paths ici, AWX gère l'installation des collections
# à partir de requirements.yml et utilise ses chemins par défaut.

[ssh_connection]
pipelining = True
ssh_args = -q -o ControlMaster=auto -o ControlPersist=60s

[privilege_escalation]
become = True
become_user = root
become_method = sudo
