---
all:
  vars:
    ansible_user: ansible
    ansible_become: true
    ansible_become_method: sudo

    one_version: "7.0"
    one_pass: "N3twork!"

    ds:
      mode: ssh

    vn:
      admin_net:
        managed: true
        template:
          VN_MAD: bridge
          PHYDEV: eth1
          BRIDGE: br0
          AR:
            TYPE: IP4
            IP: 192.168.1.150
            SIZE: 50
            NETWORK_ADDRESS: 192.168.1.0
            NETWORK_MASK: 255.255.255.0
            GATEWAY: 192.168.1.1
            DNS: 1.1.1.1

  children:
    frontend:
      hosts:
        one-aio:
          ansible_host: 192.168.1.105

    node:
      hosts:
        one-aio:
          ansible_host: 192.168.1.105
